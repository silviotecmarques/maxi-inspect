<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxi Inspect - Login</title>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f0f4f7; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        .top-bar { width: 100%; height: 40px; background-color: #005696; margin-bottom: 40px; }
        .logo-container { text-align: center; margin-bottom: 30px; }
        .brand-name { color: #005696; font-size: 28px; font-weight: bold; }
        
        /* Seletor de Login */
        .login-toggle { margin-bottom: 20px; display: flex; gap: 10px; }
        .toggle-btn { background: none; border: none; color: #0077c0; cursor: pointer; font-size: 14px; text-decoration: underline; }
        .active-toggle { font-weight: bold; color: #005696; text-decoration: none; border-bottom: 2px solid #005696; }

        .login-box { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 320px; }
        label { font-weight: bold; font-size: 18px; margin-bottom: 15px; color: #000; }
        
        /* Input Estilo FotoCheck */
        .input-field { width: 260px; height: 50px; border: 2px solid #000; border-radius: 8px; background: white; font-size: 20px; text-align: center; margin-bottom: 10px; outline: none; }
        
        button { background-color: #0077c0; color: white; border: none; padding: 12px 45px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: 500; margin-top: 15px; }
        .footer-links { margin-top: 30px; text-align: center; }
        .footer-links a { display: block; color: #0077c0; text-decoration: none; margin-bottom: 15px; font-size: 14px; }
        #error-msg { color: red; font-size: 13px; margin-top: 10px; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <div class="logo-container">
        <div style="font-size: 50px;">📱✅</div> 
        <div class="brand-name">FotoCheck</div>
    </div>

    <div class="login-toggle">
        <button class="toggle-btn active-toggle" id="btn-pin" onclick="switchLogin('pin')">Acesso por PIN</button>
        <button class="toggle-btn" id="btn-email" onclick="switchLogin('email')">Acesso Master</button>
    </div>

    <div class="login-box">
        <label id="login-label">Informe seu PIN</label>
        
        <input type="password" id="pin-input" class="input-field" maxlength="6" inputmode="numeric" placeholder="******">
        
        <input type="email" id="email-input" class="input-field hidden" placeholder="seu@email.com">

        <button onclick="autenticar()">Entrar</button>
        <div id="error-msg"></div>
    </div>

    <div class="footer-links">
        <a href="#">Enviar meu PIN no meu email</a>
        <a href="#">Como usar o FotoCheck</a>
    </div>

    <script>
        let loginMode = 'pin';

        function switchLogin(mode) {
            loginMode = mode;
            const pinInput = document.getElementById('pin-input');
            const emailInput = document.getElementById('email-input');
            const label = document.getElementById('login-label');
            
            if(mode === 'email') {
                pinInput.classList.add('hidden');
                emailInput.classList.remove('hidden');
                label.innerText = "Informe seu Email";
                document.getElementById('btn-email').classList.add('active-toggle');
                document.getElementById('btn-pin').classList.remove('active-toggle');
            } else {
                pinInput.classList.remove('hidden');
                emailInput.classList.add('hidden');
                label.innerText = "Informe seu PIN";
                document.getElementById('btn-pin').classList.add('active-toggle');
                document.getElementById('btn-email').classList.remove('active-toggle');
            }
        }

        async function autenticar() {
            const pin = document.getElementById('pin-input').value;
            const email = document.getElementById('email-input').value;
            const errorElement = document.getElementById('error-msg');
            
            // Lógica de envio
            const payload = loginMode === 'pin' 
                ? { pin: pin } // Envia só o PIN (ajustaremos o backend para aceitar isso)
                : { email: email, pin: pin }; // Aqui o 'pin' vira a 'senha' para o Master

            try {
                const response = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('maxi_token', data.token);
                    localStorage.setItem('maxi_role', data.user.role);
                    window.location.href = `pages/${data.user.role.toLowerCase()}.html`;
                } else {
                    errorElement.innerText = data.erro || "Dados incorretos.";
                }
            } catch (err) {
                errorElement.innerText = "Servidor offline.";
            }
        }
    </script>
</body>
</html>
