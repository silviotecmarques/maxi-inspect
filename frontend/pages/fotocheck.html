<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxi Inspect - FotoCheck</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        .header { background: #005696; width: 100%; padding: 15px; text-align: center; font-weight: bold; }
        .preview-container { width: 90%; max-width: 400px; height: 300px; border: 2px dashed #444; margin-top: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; }
        #photo-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
        .controls { width: 90%; max-width: 400px; margin-top: 20px; }
        input[type="file"] { display: none; }
        .btn { width: 100%; padding: 15px; margin-bottom: 10px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-capture { background: #0077c0; color: white; }
        .btn-send { background: #28a745; color: white; display: none; }
        textarea { width: 100%; background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">📸 EXECUTAR FOTOCHECK</div>

    <div class="preview-container" onclick="document.getElementById('camera-input').click()">
        <span id="placeholder">Toque para abrir a câmera</span>
        <img id="photo-preview">
    </div>

    <div class="controls">
        <input type="file" id="camera-input" accept="image/*" capture="environment">
        
        <textarea id="obs" placeholder="Observações (opcional)..."></textarea>
        
        <button class="btn btn-capture" onclick="document.getElementById('camera-input').click()">ABRIR CÂMERA</button>
        <button id="btn-send" class="btn btn-send" onclick="enviarFoto()">ENVIAR FOTOCHECK</button>
        <button class="btn" style="background: #555;" onclick="history.back()">CANCELAR</button>
    </div>

    <script>
        const cameraInput = document.getElementById('camera-input');
        const preview = document.getElementById('photo-preview');
        const placeholder = document.getElementById('placeholder');
        const btnSend = document.getElementById('btn-send');
        let base64Image = "";

        // Captura a foto e mostra o preview
        cameraInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    preview.style.display = "block";
                    placeholder.style.display = "none";
                    btnSend.style.display = "block";
                    base64Image = event.target.result; // Vamos simular o envio via Base64 por enquanto
                };
                reader.readAsDataURL(file);
            }
        });

        async function enviarFoto() {
            const token = localStorage.getItem('maxi_token');
            const tarefa_id = localStorage.getItem('tarefa_ativa_id');
            const obs = document.getElementById('obs').value;

            if (!base64Image) return alert("Tire uma foto primeiro!");

            const res = await fetch('http://localhost:3000/execucoes/enviar', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    tarefa_id: tarefa_id,
                    foto_url: base64Image, // Em produção, aqui subimos para o S3/Firebase
                    observacao: obs
                })
            });

            if (res.ok) {
                alert("Missão Cumprida!");
                window.location.href = 'promotor.html';
            } else {
                alert("Erro ao enviar. Tente novamente.");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxi Inspect - Captura</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #000; color: #fff; text-align: center; }
        .header { background: #005696; padding: 15px; font-weight: bold; }
        #video { width: 100%; max-width: 400px; background: #222; margin-top: 10px; }
        #canvas { display: none; }
        .btn-capture { background: #ffc107; color: #000; border: none; padding: 20px; border-radius: 50%; font-size: 20px; margin-top: 20px; cursor: pointer; }
        .btn-send { background: #28a745; color: #fff; border: none; padding: 15px 30px; border-radius: 8px; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="header">DIRECIONE A CÂMARA</div>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="photo-preview" style="width: 100%; max-width: 400px; display: none; margin-top: 10px; border: 2px solid #28a745;">

    <button id="capture-btn" class="btn-capture">📸</button>
    <button id="send-btn" class="btn-send">ENVIAR FOTOCHECK</button>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('photo-preview');
        const captureBtn = document.getElementById('capture-btn');
        const sendBtn = document.getElementById('send-btn');

        // Ativa a câmara traseira (environment)
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Erro ao aceder à câmara: " + err); });

        captureBtn.onclick = () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0);
            
            preview.src = canvas.toDataURL('image/jpeg');
            preview.style.display = 'block';
            video.style.display = 'none';
            captureBtn.style.display = 'none';
            sendBtn.style.display = 'inline-block';
        };

        sendBtn.onclick = async () => {
            // Lógica de envio para a rota /execucoes/enviar
            alert("Foto capturada! A enviar para o servidor...");
            window.location.href = 'promotor.html';
        };
    </script>
</body>
</html>
