<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ativar Conta - Maxi Inspect</title>
    <style>
        /* Estilo seguindo o padrão FotoCheck que você aprovou */
        body { font-family: sans-serif; background: #f0f4f7; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; height: 45px; border: 2px solid #000; border-radius: 8px; font-size: 20px; text-align: center; margin: 10px 0; outline: none; }
        button { background: #0077c0; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .info { font-size: 14px; color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Ativar sua Conta</h3>
        <p class="info">Crie seu PIN de 6 dígitos para acessar o sistema.</p>
        
        <input type="password" id="pin" maxlength="6" placeholder="Novo PIN" inputmode="numeric">
        <input type="password" id="confirm-pin" maxlength="6" placeholder="Confirme o PIN" inputmode="numeric">
        
        <button onclick="ativarConta()">Ativar Agora</button>
        <p id="msg" style="color: red; font-size: 12px;"></p>
    </div>

    <script>
        async function ativarConta() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const pin = document.getElementById('pin').value;
            const confirm = document.getElementById('confirm-pin').value;

            // Disciplina Militar: Regras do PIN [cite: 6]
            if (pin.length !== 6 || isNaN(pin)) return alert("O PIN deve ter 6 dígitos numéricos.");
            if (pin === "123456" || pin === "000000") return alert("PIN muito fraco!");
            if (pin !== confirm) return alert("Os PINs não conferem.");

            const res = await fetch('http://localhost:3000/auth/ativar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, pin })
            });

            if (res.ok) {
                alert("Conta ativada! Você já pode logar.");
                window.location.href = '../pdv/index.html';
            } else {
                document.getElementById('msg').innerText = "Link expirado ou inválido.";
            }
        }
    </script>
</body>
</html>
