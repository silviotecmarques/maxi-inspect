<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotoCheck - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f7; /* Fundo cinza azulado claro */
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Faixa Azul Superior */
        .top-bar {
            width: 100%;
            height: 40px;
            background-color: #005696;
            margin-bottom: 60px;
        }

        /* Logo e Nome */
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Ícone simulando o da imagem (Celular com Check) */
        .logo-icon {
            font-size: 70px;
            margin-bottom: 5px;
        }

        .brand-name {
            color: #005696;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        /* Área de Login */
        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        label {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            color: #000;
        }

        /* Input idêntico à imagem (Borda preta, centralizado) */
        input {
            width: 240px;
            height: 55px;
            border: 2.5px solid #000;
            border-radius: 10px;
            background: white;
            font-size: 28px;
            text-align: center;
            margin-bottom: 25px;
            outline: none;
            letter-spacing: 5px;
        }

        /* Botão Azul */
        button {
            background-color: #0077c0;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Links de Ajuda */
        .footer-links {
            margin-top: 50px;
            text-align: center;
        }

        .footer-links a {
            display: block;
            color: #0077c0;
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 15px;
        }

        #error-msg {
            color: #d9534f;
            font-size: 14px;
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <div class="logo-container">
        <div class="logo-icon">📱✅</div> 
        <div class="brand-name">FotoCheck</div>
    </div>

    <div class="login-box">
        <label>Informe seu PIN</label>
        <input type="password" id="pin-input" maxlength="6" inputmode="numeric" placeholder="******">
        
        <button onclick="autenticar()">Entrar</button>
        <div id="error-msg"></div>
    </div>

    <div class="footer-links">
        <a href="#">Enviar meu PIN no meu email</a>
        <a href="#">Como usar o FotoCheck</a>
    </div>

    <script>
        async function autenticar() {
            const pin = document.getElementById('pin-input').value;
            const errorElement = document.getElementById('error-msg');
            
            if (pin.length < 4) {
                errorElement.innerText = "Digite um PIN válido.";
                return;
            }

            try {
                // Chamada para o seu backend (authRoutes.js)
                const response = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pin }) // Envia apenas o PIN
                });

                const data = await response.json();

                if (response.ok) {
                    // Salva os dados na "memória" do navegador
                    localStorage.setItem('maxi_token', data.token);
                    localStorage.setItem('maxi_role', data.user.role);
                    localStorage.setItem('maxi_user', data.user.nome);

                    // Redireciona conforme a ROLE (Promotor ou Auditor)
                    const role = data.user.role.toLowerCase();
                    window.location.href = `../pages/${role}.html`;
                } else {
                    errorElement.innerText = "PIN incorreto. Tente novamente.";
                }
            } catch (err) {
                errorElement.innerText = "Erro ao conectar com o servidor.";
            }
        }
    </script>
</body>
</html>
